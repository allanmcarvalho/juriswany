name: Sugerir uma melhoria
description: Proponha uma melhoria ou uma futura skill para a rotina jurídica.
title: "[Sugestão] "
body:
  - type: markdown
    attributes:
      value: |
        Descreva a necessidade com dados fictícios ou anonimizados.
        O projeto está em estruturação. Uma sugestão não significa que a funcionalidade já esteja disponível.
  - type: textarea
    id: necessidade
    attributes:
      label: Que problema da rotina jurídica você quer resolver?
      description: Explique quem precisa desse apoio e em qual situação.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Como a melhoria ajudaria?
      description: Descreva a entrada, o resultado esperado e um exemplo fictício.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Como saberíamos que funcionou?
      description: Indique o que seria possível conferir no resultado e quais fontes seriam necessárias.
    validations:
      required: true
  - type: textarea
    id: limites
    attributes:
      label: Contexto e limites
      description: Informe a área do Direito, a jurisdição, as referências e as restrições relevantes, se houver.
    validations:
      required: false
  - type: checkboxes
    id: privacidade
    attributes:
      label: Conferência de privacidade
      options:
        - label: Conferi que o texto e os anexos não expõem dados pessoais, documentos sigilosos ou credenciais.
          required: true
